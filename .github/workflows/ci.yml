name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned toolchain
        run: python -m pip install -r requirements-dev.txt

      - name: Byte-compile
        run: python -m py_compile contracts/clarity.py tests/mirror.py tests/conftest.py

      - name: GenVM lint
        run: genvm-lint lint contracts/clarity.py

      - name: Test suite (deterministic direct mode, offline)
        run: python -m pytest tests/ -q

      - name: No stray probe files
        run: |
          ! ls tests/test_probe*.py 2>/dev/null
          ! ls contracts/probe*.py 2>/dev/null

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build web client
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
